  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:oklch(.145 0 0); --surface:oklch(.205 0 0); --sunk:oklch(.994 0 0 / .05);

    --gray-fill:#262626; --gray-stroke:#A1A1A1; --purple-fill:#3C3489; --purple-stroke:#AFA9EC; --purple-text:#CECBF6;
    --coral-fill:#5A2414; --coral-stroke:#F0997B; --coral-text:#F7C9BA; --teal-fill:#06403A; --teal-stroke:#5DCAA5; --teal-text:#9FE1CB;
    --shadow-m:0 4px 6px -2px oklch(0 0 0 / .08); --shadow-xl:0 8px 16px -4px oklch(0 0 0 / .2); color-scheme:dark; } }
  :root[data-theme="dark"] { --bg:oklch(.145 0 0); --surface:oklch(.205 0 0); --sunk:oklch(.994 0 0 / .05);

    --accent:oklch(.994 0 0); --on-accent:oklch(.097 0 0); --track:oklch(.994 0 0 / .1);
    --gray-fill:#262626; --gray-stroke:#A1A1A1; --purple-fill:#3C3489; --purple-stroke:#AFA9EC; --purple-text:#CECBF6;
    --coral-fill:#5A2414; --coral-stroke:#F0997B; --coral-text:#F7C9BA; --teal-fill:#06403A; --teal-stroke:#5DCAA5; --teal-text:#9FE1CB;
    --shadow-m:0 4px 6px -2px oklch(0 0 0 / .08); --shadow-xl:0 8px 16px -4px oklch(0 0 0 / .2); color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:500 16px/1.55 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; }
  main { position:relative; max-width:760px; margin:0 auto; padding:20px 14px 32px; }
  h1 { font-size:22px; font-weight:700; line-height:1.2; margin:0 0 4px; }
  .sub { color:var(--text2); font-size:14px; margin:0 0 14px; }
  #modes { display:inline-flex; gap:4px; padding:4px; background:var(--sunk); border-radius:12px; margin-bottom:14px; }
  #modes button { border-color:transparent; background:transparent; box-shadow:none; color:var(--text2); }
  #modes button.on { background:var(--surface); color:var(--text); border-color:var(--border); box-shadow:var(--shadow-m); }
  svg { display:block; width:100%; height:auto; background:var(--surface); border:1px solid var(--border); border-radius:16px; }
  #wsvg { border-bottom:none; border-radius:16px 16px 0 0; }
  svg text { font-family:inherit; }
  .tm { font-size:13px; font-weight:500; fill:var(--text); } .th { font-size:14px; font-weight:700; fill:var(--text); } .ts { font-size:12px; font-weight:500; fill:var(--text2); }
  .frame { fill:none; stroke:var(--border-emph); } .arr { stroke:var(--muted); stroke-width:1.2; fill:none; }
  .hl { fill:none; stroke:#EF9F27; stroke-width:2.2; }
  .c-gray>rect { fill:var(--gray-fill); stroke:var(--gray-stroke); } .c-gray>.tm { }
  .c-purple>rect { fill:var(--purple-fill); stroke:var(--purple-stroke); } .c-purple>.tm { fill:var(--purple-text); }
  .c-coral>rect { fill:var(--coral-fill); stroke:var(--coral-stroke); } .c-coral>.tm { fill:var(--coral-text); }
  .c-teal>rect { fill:var(--teal-fill); stroke:var(--teal-stroke); } .c-teal>.tm { fill:var(--teal-text); }
  #cap { background:var(--surface); border:1px solid var(--border); border-radius:0 0 16px 16px; padding:14px 18px 14px; min-height:118px; }
  #capch { display:inline-block; font-size:12px; font-weight:600; color:var(--text2); background:var(--sunk); border-radius:999px; padding:2px 10px; }
  #captext { font-size:16px; margin:8px 0 2px; } #caphint { font-size:13px; color:var(--text2); min-height:18px; }
  .prow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  button, select { font:inherit; font-size:14px; font-weight:500; line-height:20px; color:var(--text); background:var(--surface); border:1px solid var(--border-strong); border-radius:10px; padding:6px 14px; cursor:pointer; box-shadow:var(--shadow-m); }
  button:hover, select:hover { background:var(--sunk); box-shadow:none; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid #EF9F27; outline-offset:2px; }
  #play { background:var(--accent); color:var(--on-accent); border-color:transparent; min-width:96px; } #play:hover { opacity:.8; }
  #time { font-size:13px; color:var(--text2); margin-left:auto; font-variant-numeric:tabular-nums; }
  #scrub { position:relative; height:28px; margin:12px 0 8px; cursor:pointer; touch-action:none; }
  #scrub .track, #scrub .fill { position:absolute; top:11px; height:6px; border-radius:999px; left:0; }
  #scrub .track { right:0; background:var(--track); } #scrub .fill { background:var(--accent); }
  #scrub .tick { position:absolute; top:8px; width:2px; height:12px; margin-left:-1px; border-radius:1px; background:var(--muted); }
  #scrub .knob { position:absolute; top:5px; width:18px; height:18px; margin-left:-9px; border-radius:50%; background:var(--surface); border:1px solid var(--border-emph); box-shadow:var(--shadow-m); }
  #chips { display:inline-flex; flex-wrap:wrap; gap:4px; margin-top:10px; padding:4px; background:var(--sunk); border-radius:12px; }
  #chips button { border-color:transparent; background:transparent; box-shadow:none; color:var(--text2); padding:5px 10px; }
  #chips button.on { background:var(--surface); color:var(--text); border-color:var(--border); box-shadow:var(--shadow-m); }
  .panel { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px 18px; margin-top:14px; }
  .ctl { display:grid; grid-template-columns:1fr; gap:10px; }
  .ctl label { display:grid; grid-template-columns:150px 1fr 120px; gap:10px; align-items:center; font-size:14px; }
  .ctl output { font-variant-numeric:tabular-nums; text-align:right; font-size:14px; }
  input[type=range] { width:100%; accent-color:var(--purple-stroke); }
  .grp { font-size:12px; font-weight:600; color:var(--text2); margin:6px 0 0; }
  #ex-note { font-size:14px; color:var(--text2); margin:10px 0 0; }
  .res { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-top:12px; }
  .res div { background:var(--sunk); border-radius:12px; padding:8px 12px; }
  .res b { display:block; font-size:20px; font-variant-numeric:tabular-nums; } .res span { font-size:12px; color:var(--text2); }
  .sources { font-size:14px; color:var(--text2); background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:4px 18px; margin-top:18px; }
  .sources b { color:var(--text); font-weight:600; } .sources ol, .sources ul { padding-left:20px; }
  .sources a { color:var(--text); text-decoration:underline; text-decoration-color:var(--border-emph); text-underline-offset:3px; }
  #tip { position:absolute; display:none; max-width:270px; padding:8px 12px; font-size:13px; line-height:1.45; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow-xl); pointer-events:none; z-index:5; }
  [hidden] { display:none !important; }
  #narr.on { background:var(--purple-fill); color:var(--purple-text); border-color:var(--purple-stroke); }
  @media (max-width:560px) { #wsvg .tm { font-size:18px; } #wsvg .ts { font-size:16px; } #wsvg .th { font-size:19px; } .res { grid-template-columns:1fr 1fr; } .tm { font-size:15px; } .ts { font-size:14px; } .th { font-size:16px; } .ctl label { grid-template-columns:1fr 120px; } .ctl label input { grid-column:1 / -1; grid-row:2; } .ctl label span:first-child { grid-row:1; } .ctl output { grid-row:1; grid-column:2; } }
</style>
</head>
<body>
<main id="app">
  <h1>CBAM 與碳洩漏</h1>
  <p class="sub">歐盟碳邊境調整機制 (Carbon Border Adjustment Mechanism, CBAM)：為什麼要有它、怎麼算、什麼時候開始。</p>
  <div id="modes" role="tablist"><button id="m-walk" class="on" role="tab">導覽動畫</button><button id="m-ex" role="tab">動手試</button></div>

  <section id="walk">
    <svg id="wsvg" viewBox="0 0 680 360" role="img" aria-label="CBAM 導覽動畫"><defs>
      <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" style="stroke:var(--muted)" stroke-width="1.5"/></marker></defs><g id="dyn"></g></svg>
    <div id="cap" aria-live="polite"><div id="capch"></div><p id="captext"></p><div id="caphint"></div></div>
    <div id="scrub" data-tip="拖曳可在動畫中移動。刻度是各章的起點。"><div class="track"></div><div class="fill"></div><div id="ticks"></div><div class="knob"></div></div>
    <div class="prow"><button id="play">▶ 播放</button><button id="replay">↺ 重播此步</button><button id="next">下一步 ▸</button>
      <select id="speed" aria-label="播放速度"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select>
      <button id="narr" aria-pressed="false" data-tip="用裝置內建語音朗讀字幕。開啟後，每步唸完會自動前進。">🔈 旁白：關</button><span id="time"></span></div>
    <div id="chips"></div>
  </section>

  <section id="ex" hidden>
    <svg id="esvg" viewBox="0 0 680 250" role="img" aria-label="進口量與 50 噸門檻"></svg>
    <div class="panel">
      <p class="grp" style="margin-top:0">進口量（單位：噸商品淨重）</p>
      <div class="ctl" id="ctl-mass"></div>
      <p class="grp">計算參數（數值皆為練習用的假設）</p>
      <div class="ctl" id="ctl-par"></div>
      <div class="res" id="res"></div>
      <p id="ex-note"></p>
    </div>
  </section>

  <section class="sources">
    <p><b>簡化說明：</b>動畫與計算器省略了商品分類（CN code）、預設值與實測值的差別、各產業的 CBAM 因子與基準值、電力與氫的特殊規則。免費配額的逐年納入比例，本頁未於來源中查證，因此沒有標出數字。價格與排放強度都是練習用假設，不是市場行情。</p>
    <p><b>資料來源</b>（本頁事實皆取自下列歐盟執委會文件）</p>
    <ol id="srcs"></ol>
  </section>
  <div id="tip"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const clamp = u => Math.max(0, Math.min(1, u));
const E = u => { u = clamp(u); return u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; };
const seg = (u, a, b) => clamp((u - a) / (b - a));

/* ---------- 場景動作（純函式：只依進度 u） ---------- */
function add(S, u, id, it) { S[id] = { ...it, op: (it.op ?? 1) * E(u) }; }
function del(S, u, id) { if (!S[id]) return; if (u >= 1) delete S[id]; else S[id].op *= 1 - E(u); }
function delAll(S, u, ids) { ids.forEach(id => del(S, u, id)); }
function mv(S, u, id, to) { const it = S[id]; if (!it) return; for (const [p, v] of Object.entries(to)) { if (typeof v === 'number' && typeof it[p] === 'number') it[p] += (v - it[p]) * E(u); else if (u >= .5) it[p] = v; } }
function hl(S, u, ...ids) { if (u > 0) ids.forEach(id => S[id] && (S[id].hl = true)); }
function fly(S, u, id, a, b, fill = '#7F77DD') { if (u <= 0 || u >= 1) { delete S[id]; return; } S[id] = { type: 'dot', x: a[0] + (b[0] - a[0]) * E(u), y: a[1] + (b[1] - a[1]) * E(u), fill, op: 1 }; }
const box = (x, y, w, h, c, l1, tip, more = {}) => ({ type: 'box', x, y, w, h, c, l1, tip, ...more });
const text = (x, y, s, c = 'ts', tip) => ({ type: 'text', x, y, s, c, tip });
const line = (x1, y1, x2, y2, tip) => ({ type: 'arrow', x1, y1, x2, y2, c1x: x1 + (x2 - x1) / 3, c1y: y1 + (y2 - y1) / 3, c2x: x1 + 2 * (x2 - x1) / 3, c2y: y1 + 2 * (y2 - y1) / 3, tip });

/* ---------- 腳本 ---------- */
const CH = [], BEATS = [];
const chapter = name => CH.push({ name, beat: BEATS.length });
const step = (dur, cap, fn, pause = true) => BEATS.push({ dur, cap, fn, pause, ch: CH.length - 1 });

chapter('1 · 碳洩漏');
step(6, '歐盟的工廠必須為排放付碳價，這是歐盟排放交易系統 (EU ETS) 的規則。碳價會變成生產成本（目前部分產業仍可獲得一些免費配額）。', (S, u) => {
  add(S, seg(u, 0, .25), 'fe', box(20, 30, 300, 300, 'frame', null, '歐盟境內。'));
  add(S, seg(u, 0, .25), 'fel', text(170, 48, '歐盟', 'th'));
  add(S, seg(u, .2, .5), 'f1', box(70, 90, 200, 56, 'gray', '歐盟工廠', '歐盟境內的工廠。'));
  add(S, seg(u, .5, .8), 'c1', box(90, 180, 160, 40, 'coral', '碳價成本 ↑', '工廠要為排放買排放配額，成本變高。'));
  add(S, seg(u, .5, .8), 'a1', line(170, 146, 170, 180, '碳價讓成本變高。'));
});
step(6, '有些國家沒有同等的碳價。同一種產品在那裡生產，成本可能比較低。（這是簡化的示意，實際差異因國家與產業而異。）', (S, u) => {
  add(S, seg(u, 0, .25), 'ne', box(360, 30, 300, 300, 'frame', null, '歐盟以外的國家。'));
  add(S, seg(u, 0, .25), 'nel', text(510, 48, '歐盟以外', 'th'));
  add(S, seg(u, .2, .5), 'f2', box(410, 90, 200, 56, 'gray', '非歐盟工廠', '歐盟以外的工廠。'));
  add(S, seg(u, .5, .8), 'c2', box(430, 180, 160, 40, 'teal', '碳價成本 較低', '假設這裡沒有同等的碳價。'));
  add(S, seg(u, .5, .8), 'a2', line(510, 146, 510, 180, '成本較低。'));
});
step(7, '結果：生產可能搬到歐盟外，產品再賣回歐盟。排放可能只是移到歐盟外。這叫「碳洩漏」(carbon leakage)。', (S, u) => {
  add(S, seg(u, 0, .3), 'mv', line(272, 118, 408, 118, '生產外移。'));
  add(S, seg(u, 0, .3), 'mvl', text(340, 100, '生產外移', 'ts'));
  fly(S, seg(u, .3, .75), 'dot', [410, 270], [180, 270], '#C0472B');
  add(S, seg(u, .3, .5), 'bk', line(590, 270, 250, 270, '產品進口回歐盟。'));
  add(S, seg(u, .3, .5), 'bkl', text(420, 290, '便宜的進口品流回歐盟', 'ts'));
  hl(S, seg(u, .5, 1), 'f2');
});

chapter('2 · CBAM 的做法');
step(7, 'CBAM 讓進口商為進口品的「內含排放」(embedded emissions) 負擔相近的碳成本。它針對的是產品的排放，不是國家。', (S, u) => {
  delAll(S, seg(u, 0, .3), ['fe','fel','f1','c1','a1','ne','nel','f2','c2','a2','mv','mvl','bk','bkl']);
  add(S, seg(u, .3, .55), 'x1', box(40, 100, 130, 50, 'gray', '出口商', '在歐盟以外生產並出口的人。'));
  add(S, seg(u, .4, .65), 'x2', box(275, 100, 130, 50, 'purple', '進口商', '把商品進口到歐盟的人。'));
  add(S, seg(u, .5, .75), 'x3', box(510, 100, 130, 50, 'teal', '歐盟市場', '商品進入歐盟。'));
  add(S, seg(u, .6, .8), 'xa', line(172, 125, 273, 125, '商品流向。'));
  add(S, seg(u, .65, .85), 'xb', line(407, 125, 508, 125, '商品流向。'));
  add(S, seg(u, .7, 1), 'xe', text(340, 185, '商品帶著「內含排放」(embedded emissions) 進口', 'tm', '內含排放：生產這個商品時排放的溫室氣體。'));
  hl(S, seg(u, .8, 1), 'x2');
});
step(7, '適用的商品有：水泥、鋼鐵、鋁、肥料、氫、電力，還包括其中一些前驅物與下游產品。這些產業最容易發生碳洩漏。', (S, u) => {
  ['水泥', '鋼鐵', '鋁', '肥料', '氫', '電力'].forEach((n, i) => add(S, seg(u, i * .1, i * .1 + .25), 's' + i, box(40 + i * 100, 235, 88, 44, 'purple', n, `${n}：CBAM 適用的產業之一。`)));
  add(S, seg(u, .6, 1), 'sl', text(340, 305, '完整清單在 CBAM 規則 (Regulation) 的附件 I', 'ts', '歐盟官方列出每個 CN 商品編碼。'));
});
step(7, '超過 50 噸門檻的進口商（第 4 章）要先成為「授權 CBAM 申報人」，再購買 CBAM 憑證 (certificates) 來抵繳。憑證只給買的人用，不能轉讓或賣給別人。', (S, u) => {
  delAll(S, seg(u, 0, .25), ['xe','sl','s0','s1','s2','s3','s4','s5']);
  add(S, seg(u, .25, .5), 'd1', box(240, 200, 200, 50, 'coral', '授權 CBAM 申報人', '進口商取得授權後，才能買憑證與申報。'));
  add(S, seg(u, .4, .65), 'd2', box(480, 200, 160, 50, 'purple', 'CBAM 憑證', '1 張憑證對應 1 噸 CO₂ 當量 (tCO₂e) 的內含排放。'));
  add(S, seg(u, .5, .75), 'd3', line(442, 225, 478, 225, '申報人購買憑證。'));
  add(S, seg(u, .5, .75), 'da', line(340, 152, 340, 198, '進口商成為申報人。'));
  fly(S, seg(u, .65, .95), 'dot', [560, 200], [340, 152], '#7F77DD');
});
step(7, '憑證價格會跟著 EU ETS 的價格走。2026 年按季計算，2027 年起按週計算。憑證預計從 2027 年 2 月 1 日開始販售。', (S, u) => {
  add(S, seg(u, 0, .3), 't1', box(40, 270, 190, 44, 'gray', '2026：按季定價', '2026 年每季公布一個價格，是 EU ETS 拍賣價的平均。'));
  add(S, seg(u, .25, .55), 't2', box(250, 270, 190, 44, 'gray', '2027 起：按週定價', '2027 年起每週公布一個價格。'));
  add(S, seg(u, .5, .85), 't3', box(460, 270, 180, 44, 'purple', '2027-02-01 開賣', '憑證從這天起可以買。'));

/* ---------- 時間與繪製 ---------- */

  if (it.type === 'text') return `<g${o}${tp}>${T(it.x, it.y, it.s, it.c)}</g>`;
  if (it.type === 'dot') return `<circle cx="${it.x}" cy="${it.y}" r="5" fill="${it.fill}"${o}/>`;
  if (it.type === 'arrow') return `<path class="arr" d="M${it.x1} ${it.y1}C${it.c1x} ${it.c1y} ${it.c2x} ${it.c2y} ${it.x2} ${it.y2}" marker-end="url(#ah)"${o}${tp}/>`;
  if (it.h < 1 && !it.l1) return '';
  const fr = it.c === 'frame';
  let s = `<g class="${fr ? '' : 'c-' + it.c}"${o}${tp}><rect class="${fr ? 'frame' : ''}" x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}" rx="${fr ? 10 : 6}" stroke-width="0.8"/>`;
  if (it.l1) s += T(it.x + it.w / 2, it.y + it.h / 2, it.l1, 'tm');
  s += '</g>';
  if (it.hl) s += `<rect class="hl" x="${it.x - 2.5}" y="${it.y - 2.5}" width="${it.w + 5}" height="${it.h + 5}" rx="8" opacity="${(op * (.55 + .45 * Math.sin(now / 260))).toFixed(3)}"/>`;

}

/* ---------- 播放器 ---------- */
let t = 0, playing = false, speed = 1, last = null, skipPause = -1, capKey = '', mode = 'walk';
const beatAt = tt => { let i = 0; while (i < BEATS.length - 1 && tt >= BEATS[i].t1) i++; return i; };
function setPlaying(p) {

  $('play').textContent = p ? '❚❚ 暫停' : '▶ 播放';
}
function seek(tt, play) { t = Math.max(0, Math.min(TOTAL - EPS, tt)); skipPause = -1; spokenBeat = -1; autoNext = false; if (TTS && !play) TTS.cancel(); setPlaying(!!play); if (play && narrOn) speak(beatAt(t)); }
function tick(now) {
  const dt = last == null ? 0 : Math.min(.1, (now - last) / 1000); last = now;
  if (mode === 'walk') {
    if (playing) {
      const i = beatAt(t), b = BEATS[i]; let nt = t + dt * speed;
      if (i !== skipPause && b.pause && nt >= b.t1 - EPS) { nt = b.t1 - EPS; setPlaying(false); autoNext = narrOn; }
      if (nt >= TOTAL - EPS) { nt = TOTAL - EPS; setPlaying(false); }
      if (beatAt(nt) !== i) skipPause = -1;
      t = nt;
    }
    const { S, i } = stateAt(t);
    $('dyn').innerHTML = Object.values(S).map(it => draw(it, now)).join('');
    const b = BEATS[i], atEnd = t >= b.t1 - .03, key = i + '|' + playing + '|' + atEnd + '|' + narrOn + '|' + speechErr;
    if (key !== capKey) {

      $('capch').textContent = `${CH[b.ch].name} ・ 第 ${i + 1} / ${BEATS.length} 步`;
      $('captext').textContent = b.cap;
      $('caphint').textContent = speechErr ? `旁白無法播放（${speechErr}）。請確認裝置沒有靜音，並已安裝中文語音。` : playing ? '' : atEnd ? (narrOn ? '旁白唸完會自動繼續。' : '已暫停。按「播放」或空白鍵繼續。') : '已暫停。';

    const f = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

}
$('ticks').innerHTML = CH.map(c => `<div class="tick" style="left:${c.t0 / TOTAL * 100}%"></div>`).join('');
$('chips').innerHTML = CH.map((c, k) => `<button data-ch="${k}">${esc(c.name)}</button>`).join('');

// 優先順序：曉臻（Microsoft Edge 的自然語音）→ 美佳增強／高品質版 → 美佳 → 其他台灣中文 → 其他中文
function voice() {
  const v = TTS.getVoices(), tw = v.filter(x => /zh[-_]TW/i.test(x.lang)), mj = tw.filter(x => /Meijia|美佳/i.test(x.name));
  return v.find(x => /HsiaoChen|曉臻|晓臻/i.test(x.name)) || mj.find(x => /enhanced|premium|增強|高品質|優化/i.test(x.name)) || mj[0] || tw[0] || v.find(x => /^zh/i.test(x.lang)) || null;
}
const ZH_NAME = { HsiaoChen: '曉臻', HsiaoYu: '曉雨', YunJhe: '雲哲', Yating: '雅婷', Hanhan: '涵涵', Zhiwei: '志瑋', Meijia: '美佳', Tingting: '婷婷', 'Sin-ji': '善怡' };
const voiceName = () => { const v = TTS && voice(); if (!v) return ''; const k = Object.keys(ZH_NAME).find(n => v.name.includes(n)); return k ? ZH_NAME[k] + (/enhanced|premium|增強|高品質/i.test(v.name) ? '・高品質' : '') : v.name.replace(/^Microsoft\s+/i, '').replace(/\s*\(.*$|\s+-\s+.*$/, ''); };
function narrLabel() { $('narr').textContent = narrOn ? `🔊 旁白：開${voiceName() ? '（' + voiceName() + '）' : ''}` : '🔈 旁白：關'; }
if (TTS && 'onvoiceschanged' in TTS) TTS.onvoiceschanged = () => narrOn && narrLabel();
let curU = null, speechErr = '';
// iOS／Safari：第一次朗讀必須在點擊當下呼叫；保留 utterance 參照，避免被回收而中斷。
function speak(i) {
  if (!TTS || !narrOn) return;
  if (TTS.speaking || TTS.pending) TTS.cancel();
  spokenBeat = i;
  const u = new SpeechSynthesisUtterance(SAY(BEATS[i].cap)); u.lang = 'zh-TW'; u.rate = speed; const v = voice(); if (v) u.voice = v;
  u.onstart = () => { if (speechErr) { speechErr = ''; capKey = ''; } };
  u.onerror = e => { if (e.error && e.error !== 'interrupted' && e.error !== 'canceled') { speechErr = e.error; capKey = ''; } };
  curU = u; TTS.speak(u); if (TTS.paused) TTS.resume();
}
if (!TTS) $('narr').hidden = true;
$('narr').onclick = () => {
  narrOn = !narrOn; $('narr').classList.toggle('on', narrOn); $('narr').setAttribute('aria-pressed', narrOn);
  narrLabel();
  if (!narrOn) { TTS.cancel(); autoNext = false; speechErr = ''; capKey = ''; } else { speak(beatAt(t)); if (!playing) setPlaying(true); }
};
function narrTick() {
  if (!TTS || !narrOn || mode !== 'walk') return;
  const i = beatAt(t);
  if (playing && spokenBeat !== i) speak(i);
  // 這一步的動畫播完而自動暫停時，等旁白唸完再前進
  if (!playing && autoNext && !TTS.speaking && !TTS.pending) { autoNext = false; if (i < BEATS.length - 1) seek(BEATS[i + 1].t0, true); }
}
function setMode(m) {
  mode = m; $('walk').hidden = m !== 'walk'; $('ex').hidden = m !== 'ex';
  $('m-walk').classList.toggle('on', m === 'walk'); $('m-ex').classList.toggle('on', m === 'ex');
  if (m === 'ex') { setPlaying(false); autoNext = false; if (TTS) TTS.cancel(); renderEx(); }
}
$('m-walk').onclick = () => setMode('walk'); $('m-ex').onclick = () => setMode('ex');

$('srcs').innerHTML = [
  ['歐盟執委會：Guidance Document No. 1 — Introduction to CBAM concepts（2026 年 8 月版）', 'https://taxation-customs.ec.europa.eu/system/files/2026-08/Guidance%20No.%201%20-%20Introduction%20to%20CBAM%20concepts.pdf'],
  ['歐盟執委會：Carbon Border Adjustment Mechanism (CBAM) Questions and Answers（2026 年 10 月 15 日更新）', 'https://taxation-customs.ec.europa.eu/document/download/013fa763-5dce-4726-a204-69fec04d5ce2_en'],
].map(([n, u]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(n)}</a></li>`).join('');
seek(0, false); renderEx(); requestAnimationFrame(tick);
</script>
</body>
